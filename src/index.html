<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <title>LinkedIn Automation - Scheduled Post Engine</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    #nl-badge-frame,
    #nl-hud-frame,
    iframe[title*="Netlify"],
    iframe[title="Powered by Netlify"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      clip-path: circle(0) !important;
    }
  </style>
  <script>
    if (typeof window !== 'undefined' && window.MutationObserver) {
      new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var nodes = mutations[i].addedNodes;
          for (var j = 0; j < nodes.length; j++) {
            var n = nodes[j];
            if (n.id === 'nl-badge-frame' || n.id === 'nl-hud-frame' || (n.tagName === 'IFRAME' && n.title && n.title.indexOf('Netlify') !== -1)) {
              n.remove();
            }
          }
        }
      }).observe(document.documentElement, { childList: true, subtree: true });
    }
  </script>
</head>
<body class="bg-secondary-50 antialiased text-secondary-900">
  <app-root></app-root>
</body>
</html>
