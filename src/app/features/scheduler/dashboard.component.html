<div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
  @if (state.isInitialLoading()) {
    <section aria-label="Loading Overview" class="space-y-3">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
        @for (i of [1, 2, 3, 4]; track i) {
          <div class="bg-white p-5 rounded-2xl border border-secondary-200/80 shadow-xs space-y-3 animate-pulse" role="status" aria-label="Loading metric...">
            <div class="flex items-center justify-between">
              <div class="h-3.5 w-20 bg-secondary-200 rounded"></div>
              <div class="h-5 w-5 bg-secondary-100 rounded-md"></div>
            </div>
            <div class="h-7 w-12 bg-secondary-200 rounded"></div>
          </div>
        }
      </div>
    </section>

    <hr class="border-t border-secondary-200/60" />

    <div class="space-y-8">
      <div class="bg-white rounded-2xl border border-secondary-200/80 shadow-xs p-6 mb-8 space-y-5 animate-pulse" role="status" aria-label="Loading post composer...">
        <div class="flex items-center justify-between pb-4 border-b border-secondary-100">
          <div class="space-y-1.5">
            <div class="h-5 w-48 bg-secondary-200 rounded-lg"></div>
            <div class="h-3 w-72 bg-secondary-100 rounded"></div>
          </div>
          <div class="h-4 w-28 bg-secondary-100 rounded"></div>
        </div>

        <div class="p-3 bg-secondary-50/80 rounded-xl border border-secondary-200/70 space-y-2">
          <div class="h-3.5 w-28 bg-secondary-200 rounded"></div>
          <div class="flex flex-wrap items-center gap-2">
            <div class="h-10 w-44 bg-secondary-200 rounded-xl"></div>
            <div class="h-10 w-44 bg-secondary-100 rounded-xl"></div>
          </div>
        </div>

        <div class="h-28 w-full bg-secondary-50 border border-secondary-200 rounded-xl"></div>

        <div class="flex items-center gap-2">
          <div class="h-3.5 w-14 bg-secondary-200 rounded"></div>
          <div class="h-6 w-14 bg-secondary-100 rounded-lg"></div>
          <div class="h-6 w-12 bg-secondary-100 rounded-lg"></div>
          <div class="h-6 w-16 bg-secondary-100 rounded-lg"></div>
          <div class="h-6 w-14 bg-secondary-100 rounded-lg"></div>
        </div>

        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <div class="h-3.5 w-36 bg-secondary-200 rounded"></div>
            <div class="h-3 w-28 bg-secondary-100 rounded"></div>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <div class="h-10 bg-secondary-100 rounded-xl"></div>
            <div class="h-10 bg-secondary-100 rounded-xl"></div>
            <div class="h-10 bg-secondary-100 rounded-xl"></div>
            <div class="h-10 bg-secondary-100 rounded-xl"></div>
          </div>
        </div>

        <div class="flex justify-end pt-2">
          <div class="h-10 w-36 bg-secondary-200 rounded-xl"></div>
        </div>
      </div>

      <div class="space-y-4 animate-pulse" role="status" aria-label="Loading post queue...">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pb-3 border-b border-secondary-200">
          <div class="space-y-1.5">
            <div class="h-5 w-48 bg-secondary-200 rounded-lg"></div>
            <div class="h-3 w-64 bg-secondary-100 rounded-md"></div>
          </div>
          <div class="h-8 w-64 bg-secondary-100 rounded-xl"></div>
        </div>

        <div class="space-y-3">
          <div class="bg-white rounded-2xl border border-secondary-200/80 p-5 space-y-3 shadow-xs">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <div class="h-5 w-24 bg-secondary-200 rounded-md"></div>
                <div class="h-4 w-36 bg-secondary-100 rounded-md"></div>
              </div>
              <div class="h-6 w-16 bg-secondary-100 rounded-md"></div>
            </div>
            <div class="space-y-2 pt-1">
              <div class="h-4 bg-secondary-100 rounded-md w-5/6"></div>
              <div class="h-4 bg-secondary-100 rounded-md w-1/2"></div>
            </div>
          </div>
          <div class="bg-white rounded-2xl border border-secondary-200/80 p-5 space-y-3 shadow-xs">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <div class="h-5 w-28 bg-secondary-200 rounded-md"></div>
                <div class="h-4 w-40 bg-secondary-100 rounded-md"></div>
              </div>
              <div class="h-6 w-16 bg-secondary-100 rounded-md"></div>
            </div>
            <div class="space-y-2 pt-1">
              <div class="h-4 bg-secondary-100 rounded-md w-3/4"></div>
              <div class="h-4 bg-secondary-100 rounded-md w-1/3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  } @else {
    <section aria-label="Scheduling Metrics Overview" class="space-y-3">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
        <div title="Total posts scheduled">
          <app-stat-card [title]="'Total Posts'" [value]="state.counts().all" [variant]="'primary'" [loading]="state.posts.isLoading() || state.isSessionChecking()">
            <app-icon
              icon
              name="send"
              class="text-secondary-400 text-lg group-hover:text-primary-600"
            />
          </app-stat-card>
        </div>

        <div title="Posts awaiting their scheduled execution window">
          <app-stat-card [title]="'Pending Queue'" [value]="state.counts().pending" [variant]="'warning'" [loading]="state.posts.isLoading() || state.isSessionChecking()">
            <app-icon
              icon
              name="clock"
              class="text-warning-500 text-lg animate-pulse"
            />
          </app-stat-card>
        </div>

        <div title="Posts successfully published to your LinkedIn feed">
          <app-stat-card [title]="'Published Live'" [value]="state.counts().published" [variant]="'success'" [loading]="state.posts.isLoading() || state.isSessionChecking()">
            <app-icon
              icon
              name="check"
              class="text-success-500 text-lg"
            />
          </app-stat-card>
        </div>

        <div title="Posts that encountered errors during publishing">
          <app-stat-card [title]="'Failed / Errors'" [value]="state.counts().failed" [variant]="'error'" [loading]="state.posts.isLoading() || state.isSessionChecking()">
            <app-icon
              icon
              name="alert"
              class="text-error-500 text-lg"
            />
          </app-stat-card>
        </div>
      </div>
    </section>

    <hr class="border-t border-secondary-200/60" />

    <div class="space-y-8">
      <app-post-form />
      <app-post-list />
    </div>
  }
</div>
