<div
  rdxProgressRoot
  [value]="value()"
  [max]="max()"
  class="flex flex-col gap-1 w-full"
  [attr.aria-label]="label()"
>
  @if (label() || showValueText()) {
    <header class="flex justify-between items-center text-xs font-semibold gap-1">
      @if (label()) {
        <span class="text-secondary-400">{{ label() }}</span>
      }
      @if (showValueText()) {
        <output [class]="textClass()">
          {{ valueText() }}
        </output>
      }
    </header>
  }
  <div rdxProgressTrack class="h-1.5 w-full bg-secondary-100 rounded-full overflow-hidden">
    <div
      rdxProgressIndicator
      class="h-full transition-all duration-300 rounded-full"
      [class]="indicatorClass()"
      [style.width.%]="percentage()"
    ></div>
  </div>
</div>
