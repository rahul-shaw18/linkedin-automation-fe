<div rdxAlertDialogRoot>
  <button rdxAlertDialogTrigger type="button" class="cursor-pointer">
    <ng-content select="[trigger]" />
  </button>

  <ng-template rdxAlertDialogPortal>
    <div
      class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs animate-in fade-in duration-150"
      rdxAlertDialogBackdrop
    ></div>

    <div
      class="fixed top-1/2 left-1/2 z-50 -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl p-6 shadow-xl border border-secondary-200 max-w-sm w-full animate-in zoom-in-95 duration-150"
      rdxAlertDialogPopup
    >
      <h2 class="text-base font-bold text-secondary-900" rdxAlertDialogTitle>
        {{ title() }}
      </h2>
      <p class="text-xs text-secondary-500 mt-2 leading-relaxed" rdxAlertDialogDescription>
        {{ description() }}
      </p>

      <footer class="flex justify-end gap-2 mt-5">
        <button
          appButton
          [variant]="'secondary'"
          [size]="'sm'"
          rdxAlertDialogClose
        >
          {{ cancelText() }}
        </button>
        <button
          appButton
          [variant]="confirmVariant() === 'destructive' ? 'destructive' : 'primary'"
          [size]="'sm'"
          (click)="onConfirm()"
          rdxAlertDialogClose
        >
          {{ confirmText() }}
        </button>
      </footer>
    </div>
  </ng-template>
</div>
