<section class="group bg-white rounded-2xl border border-secondary-200/80 p-12 text-center" aria-label="Empty State">
  <figure
    class="w-12 h-12 mx-auto rounded-full bg-secondary-100 flex items-center justify-center text-secondary-400 mb-3 transition-transform duration-300 group-hover:scale-110"
    aria-hidden="true"
  >
    <ng-content select="[icon]" />
  </figure>
  <h3 class="text-sm font-semibold text-secondary-800">{{ title() }}</h3>
  <p class="text-xs text-secondary-500 mt-1 max-w-sm mx-auto leading-relaxed">
    {{ description() }}
  </p>
  <ng-content select="[action]" />
</section>
