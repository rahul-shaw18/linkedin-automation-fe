<article
  class="group bg-white p-3.5 sm:p-5 rounded-2xl border border-secondary-200/80 shadow-xs transition-all"
  [class]="hoverBorderClass()"
  [attr.aria-label]="title() + ': ' + value()"
>
  <header class="flex items-center justify-between gap-1">
    <h3 class="text-xs font-medium truncate" [class]="labelColorClass()">{{ title() }}</h3>
    <div class="transition-transform duration-300 group-hover:scale-110 shrink-0" aria-hidden="true">
      <ng-content select="[icon]" />
    </div>
  </header>
  @if (loading()) {
    <div class="h-7 sm:h-8 w-12 sm:w-16 bg-secondary-200 rounded animate-pulse mt-2"></div>
  } @else {
    <output class="block text-xl sm:text-2xl font-bold mt-1 sm:mt-2" [class]="valueColorClass()">{{ value() }}</output>
  }
</article>
